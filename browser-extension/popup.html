<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PCV 伴随浏览</title>
  <style>
    body { width: 300px; margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 8px 0; }
    button, input, select { font: inherit; }
    #toggle { width: 100%; min-height: 42px; font-weight: 600; }
    #status, #detail { overflow-wrap: anywhere; }
    details { margin-top: 14px; }
    summary { cursor: pointer; }
    #token { box-sizing: border-box; width: 100%; }
  </style>
</head>
<body>
  <h1>PCV 伴随浏览</h1>
  <p>将可见页面文字和支持平台的短音画片段保存到本机。</p>
  <button id="toggle" disabled aria-describedby="status detail">正在读取状态…</button>
  <p id="status" role="status"></p>
  <p id="detail" aria-live="polite"></p>
  <details id="settings">
    <summary>设置</summary>
    <p id="pairing" hidden>
      <label for="token">首次使用时，从本机 PCV 窗口复制配对码。</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false">
    </p>
    <p><label>新增采集范围
      <select id="scope">
        <option value="site">当前站点</option>
        <option value="all">所有 HTTP/HTTPS 网站</option>
      </select>
    </label></p>
    <p>已授权的范围会保留。抖音、哔哩哔哩和 YouTube 支持当前标签页音画采集。</p>
    <p><button id="pauseAll" hidden>暂停全部采集</button></p>
  </details>
  <script src="popup.js"></script>
</body>
</html>
